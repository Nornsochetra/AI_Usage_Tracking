spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_usage}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8081}

gateway:
  anthropic:
    upstream-base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    upstream-api-key: ${ANTHROPIC_API_KEY:}
  gemini:
    upstream-base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    upstream-api-key: ${GEMINI_API_KEY:}
